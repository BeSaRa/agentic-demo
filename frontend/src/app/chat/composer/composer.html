<form class="composer" (submit)="$event.preventDefault(); submit()">
  <textarea
    #textarea
    class="composer__input"
    rows="1"
    placeholder="Message the agent…"
    aria-label="Message"
    [value]="draft()"
    (input)="onInput()"
    (keydown)="onKeydown($event)"
  ></textarea>

  @if (running()) {
    <button type="button" class="composer__button composer__button--stop" (click)="stop.emit()">Stop</button>
  } @else {
    <button type="submit" class="composer__button" [disabled]="!canSend()">Send</button>
  }
</form>
